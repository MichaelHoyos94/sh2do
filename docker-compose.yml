# Monorepo montado en /app. node_modules vive en volúmenes nombrados (binarios de Linux),
# compartidos por api, worker y web; el servicio `deps` los instala una sola vez.
x-node-volumes: &node-volumes
  - .:/app
  - node_modules:/app/node_modules
  - backend_node_modules:/app/backend/node_modules
  - frontend_node_modules:/app/frontend/node_modules

x-backend: &backend
  build: ./backend
  env_file: .env
  working_dir: /app
  volumes: *node-volumes
  environment:
    CHOKIDAR_USEPOLLING: 'true' # el montaje desde Windows no emite eventos de archivos
  depends_on:
    deps: { condition: service_completed_successfully }
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    env_file: .env
    ports: ['3306:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['8025:8025', '1025:1025']

  deps:
    build: ./backend
    env_file: .env
    working_dir: /app
    volumes: *node-volumes
    # Reinstala solo si package-lock.json es más nuevo que lo instalado.
    command: >
      sh -c "{ [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund; }
      && npm run db:generate -w backend"
    restart: 'no'

  api:
    <<: *backend
    command: npm run dev -w backend
    ports: ['3000:3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    <<: *backend
    command: npm run dev:worker -w backend

  web:
    build: ./frontend
    working_dir: /app
    volumes: *node-volumes
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command: npm run dev -w frontend -- --host
    ports: ['5173:5173']
    depends_on:
      deps: { condition: service_completed_successfully }

volumes:
  mysql-data:
  node_modules:
  backend_node_modules:
  frontend_node_modules:
