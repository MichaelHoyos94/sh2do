openapi: 3.1.0
info:
  title: Sh2do API — STD-11 Asignar prioridades y etiquetas, y filtrar
  version: 1.0.0
  description: |
    Amplía los pendientes de STD-8 y STD-9:
    - `POST /tasks` y `PATCH /tasks/{taskId}` aceptan `priority` y `tagIds`.
    - `GET /tasks` acepta los filtros `status`, `priority` y `tagIds`.
    - El esquema `Task` incluye `tags`. **Sustituye** al `Task` de STD-8 en todas las respuestas
      que lo devuelven, incluida `PUT /tasks/{taskId}/status` de STD-9 (que no cambia en nada más).

    Todas las rutas requieren sesión (Bearer). Un pendiente ajeno o inexistente responde `404`.

    **Errores**: `application/problem+json` (RFC 9457) con `code` estable; `title`, `detail` y `message` en español.
servers:
  - url: /api/v1

tags:
  - name: tasks

security:
  - bearerAuth: []

paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Listar mis pendientes, con filtros opcionales
      description: |
        Del más reciente al más antiguo (por creación). Paginación por cursor.

        **Filtros combinables:** dentro de un mismo parámetro basta con cumplir **uno** de los valores
        (OR); entre parámetros distintos hay que cumplir **todos** (AND). Un parámetro ausente no filtra.
        Los valores van separados por comas (`?status=pending,in_progress&priority=high&tagIds=3,7`).
        Un `tagIds` que no es del usuario simplemente no coincide con ningún pendiente.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Valor de `nextCursor` de la página anterior, con los mismos filtros. Opaco para el cliente.
          schema: { type: string, maxLength: 32 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          required: false
          style: form
          explode: false
          description: Estados separados por comas. Un valor vacío o desconocido → `422` en `status`.
          schema:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/TaskStatus' }
        - name: priority
          in: query
          required: false
          style: form
          explode: false
          description: Prioridades separadas por comas. Un valor vacío o desconocido → `422` en `priority`.
          schema:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/TaskPriority' }
        - name: tagIds
          in: query
          required: false
          style: form
          explode: false
          description: |
            Ids de etiquetas separados por comas; el pendiente debe tener **al menos una**.
            Entre 1 y 20 ids enteros positivos; si no → `422` en `tagIds`.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Una página de pendientes que cumplen los filtros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Crear un pendiente
      description: Empieza con estado `pending`. Sin `priority`, queda en `medium` (RN-PEN-3). Sin `tagIds`, sin etiquetas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Pendiente creado.
          headers:
            Location:
              description: '`/api/v1/tasks/{id}`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        description: Un id que no sea un entero positivo responde `404` (antes de validar el body).
        schema: { type: integer, minimum: 1 }
    get:
      tags: [tasks]
      operationId: getTask
      summary: Consultar un pendiente
      responses:
        '200':
          description: El pendiente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Editar un pendiente
      description: |
        Actualización parcial, con las mismas reglas que en STD-8 para `title`, `description`,
        `scheduledDate` y `scheduledTime`.
        - `priority` fija la prioridad.
        - `tagIds` **sustituye** el conjunto completo de etiquetas del pendiente (`[]` quita todas).
          Si no se envía, las etiquetas no cambian.
        Si nada cambia de verdad (mismos valores, mismas etiquetas en cualquier orden), no se escribe
        nada ni cambia `updatedAt`, y responde `200`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Pendiente actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: JSON mal formado o cuerpo demasiado grande (`VALIDATION_ERROR`, sin lista de campos).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Sin sesión o con un access token inválido o vencido (`UNAUTHENTICATED`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: El pendiente no existe o es de otro usuario (`NOT_FOUND`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://sh2do.app/problems/not-found
            title: No encontrado
            status: 404
            detail: Este pendiente no existe.
            code: NOT_FOUND
    ValidationError:
      description: Datos inválidos (`VALIDATION_ERROR`), con un error por campo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://sh2do.app/problems/validation-error
            title: Datos inválidos
            status: 422
            detail: Revisa los campos marcados.
            code: VALIDATION_ERROR
            errors:
              - field: tagIds
                message: Alguna de las etiquetas elegidas no existe.

  schemas:
    TaskStatus:
      type: string
      enum: [pending, in_progress, completed]
      description: '`pendiente`, `en progreso`, `completado`.'

    TaskPriority:
      type: string
      enum: [low, medium, high]
      description: '`baja`, `media`, `alta`.'

    LocalDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: Fecha local `YYYY-MM-DD`; debe ser una fecha de calendario válida.
      examples: ['2026-11-28']

    LocalTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Hora local `HH:mm` (24 h).
      examples: ['18:30']

    TaskTag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 60 }

    Task:
      type: object
      required:
        [id, title, description, status, priority, tags, scheduledDate, scheduledTime, timezone, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        tags:
          type: array
          maxItems: 20
          description: Etiquetas del pendiente, en orden alfabético sin distinguir mayúsculas.
          items: { $ref: '#/components/schemas/TaskTag' }
        scheduledDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        scheduledTime:
          oneOf:
            - { $ref: '#/components/schemas/LocalTime' }
            - { type: 'null' }
        timezone:
          type: string
          description: Zona IANA en la que están la fecha y la hora (la del usuario).
          examples: ['America/Bogota']
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        nextCursor:
          type: [string, 'null']
          description: '`null` si no hay más páginas.'

    TagIds:
      type: array
      maxItems: 20
      uniqueItems: true
      items: { type: integer, minimum: 1 }
      description: |
        Ids de etiquetas **propias**, sin repetir, como máximo 20. Errores `422` en `tagIds`:
        repetidos → "No repitas etiquetas."; más de 20 → "Un pendiente admite como máximo 20 etiquetas.";
        alguno ajeno o inexistente → "Alguna de las etiquetas elegidas no existe." (no se distingue cuál
        ni por qué, para no revelar etiquetas ajenas).

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Se recorta. Vacío tras recortar → `422`.
        description:
          type: [string, 'null']
          maxLength: 5000
          description: Se recorta. Vacía tras recortar se guarda como `null`.
        scheduledDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        scheduledTime:
          description: Solo con `scheduledDate`; sin fecha → `422` en `scheduledTime`.
          oneOf:
            - { $ref: '#/components/schemas/LocalTime' }
            - { type: 'null' }
        priority:
          $ref: '#/components/schemas/TaskPriority'
          description: Por defecto `medium`. Un valor desconocido → `422` "Elige una prioridad válida."
        tagIds: { $ref: '#/components/schemas/TagIds' }

    UpdateTaskRequest:
      type: object
      additionalProperties: false
      description: Mismas reglas que `CreateTaskRequest`, pero todos los campos son opcionales.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        scheduledDate:
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        scheduledTime:
          oneOf:
            - { $ref: '#/components/schemas/LocalTime' }
            - { type: 'null' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        tagIds: { $ref: '#/components/schemas/TagIds' }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - NOT_FOUND
            - INTERNAL_ERROR
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
